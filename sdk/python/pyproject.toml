[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantys"
version = "0.1.0"
description = "Python SDK for Semantys AI - Semantic LLM Cache"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Semantys AI"},
]
keywords = ["llm", "cache", "semantic", "openai", "gpt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.urls]
Homepage = "https://semantys.ai"
Documentation = "https://docs.semantys.ai"
Repository = "https://github.com/semantys-ai/semantys-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantys"]
